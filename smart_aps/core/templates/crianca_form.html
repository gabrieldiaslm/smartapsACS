{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header text-white" style="background-color: var(--primary-color);">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-baby"></i> Cadastrar Nova Criança</h5>
            </div>
            
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold text-secondary">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <hr class="my-4">

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary rounded-pill px-4">
                            Cancelar
                        </a>
                        
                        <button type="submit" class="btn btn-laranja shadow-sm px-4 rounded-pill">
                            <i class="fa-solid fa-check"></i> Salvar Cadastro
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
    var inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(function(input) {
        if (!input.classList.contains('form-check-input')) {
            input.classList.add('form-control');
        }
    });
</script>
{% endblock %}
