{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <a href="{% url 'index' %}" class="btn-voltar-destaque">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </a>
    <h4 class="text-primary fw-bold m-0"><i class="fa-solid fa-table"></i> Controle</h4>
    <a href="{% url 'cadastrar_crianca' %}" class="btn btn-success btn-sm shadow-sm">
        <i class="fa-solid fa-plus"></i> Novo Paciente
    </a>
</div>

<form method="get" class="mb-4">
    <div class="input-group shadow-sm">
        <input type="text" name="busca" class="form-control" placeholder="Buscar por nome ou CPF...">
        <button class="btn btn-primary" type="submit"><i class="fa-solid fa-search"></i></button>
    </div>
</form>

<div class="list-group shadow-sm">
    {% for crianca in criancas %}
    <a href="{% url 'cartao_vacina' crianca.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
        <div>
            <h5 class="mb-1 fw-bold text-dark">{{ crianca.nome }}</h5>
            <small class="text-muted">
                <i class="fa-solid fa-person-breastfeeding"></i> Mãe: {{ crianca.nome_mae }} | 
                <i class="fa-solid fa-id-card-clip"></i> CNS: {{ crianca.cns }}
            </small>
        </div>
        <i class="fa-solid fa-chevron-right text-muted"></i>
    </a>
    {% empty %}
    <div class="alert alert-info text-center">
        <i class="fa-solid fa-circle-info"></i> Nenhuma criança encontrada.
    </div>
    {% endfor %}
</div>
{% endblock %}
